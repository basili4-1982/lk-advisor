name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lk
          POSTGRES_PASSWORD: lk
          POSTGRES_DB: lk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lk -d lk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://lk:lk@localhost:5432/lk?sslmode=disable
      TEST_DATABASE_URL: postgres://lk:lk@localhost:5432/lk?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -p 1 ./...
      - run: go build ./...
      - run: go run ./cmd/lk-advisor migrate
      - run: go run ./cmd/lk-advisor seed --seed 42
      - run: go run ./cmd/lk-advisor eval
